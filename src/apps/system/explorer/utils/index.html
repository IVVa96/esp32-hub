  :root{
    --bg:#000000; --panel:#0a0a0b; --panel2:#121214; --panel3:#1a1a1d;
    --line:#3d3d42; --line2:#5a5a62;
    --text:#f1f0f0; --muted:#bcbbbb; --dim:#8e8b8b;
    --accent:#ff8c1a; --accent-ink:#000000; --accent-hi:#ffb45e;
    --danger:#ff5c5c; --ok:#7dff9a;
    --pixel:"Press Start 2P",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#000;color:var(--text);
    font:10px/1.85 var(--pixel);-webkit-font-smoothing:none;text-rendering:geometricPrecision;
    letter-spacing:0}
  /* CRT scanlines: barely visible, keeps the terminal feel */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay}
  input,select,textarea{font-family:var(--pixel);font-size:10px}
  ::selection{background:rgba(255,140,26,.45);color:inherit}
  a{color:var(--text);text-decoration:none}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:rgba(0,0,0,.94);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;color:var(--accent);
    font-size:11px;white-space:nowrap}
  .brand:hover{color:var(--accent-hi)}
  .run{display:flex;align-items:center;gap:7px;color:var(--muted);
    font-size:8px;white-space:nowrap}
  .dot{width:7px;height:7px;background:var(--dim);display:inline-block;
    box-shadow:0 0 0 1px #000}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  #modeInfo{position:relative;top:1px}
  .meta{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chip{display:inline-block;padding:5px 7px 4px;border:1px solid var(--line2);
    background:var(--panel);color:var(--muted);font-size:7px}
  .chip b{color:var(--accent);font-weight:400}
  header .tiny{border:1px solid var(--line2);padding:6px 8px 5px;font-size:7px;
    background:var(--panel2);color:var(--muted);box-shadow:none}
  header .tiny:hover{background:var(--panel2);color:var(--accent);
    border-color:var(--accent);transform:none}
  header .tiny.danger{color:var(--danger);border-color:var(--danger)}
  header .tiny.danger:hover{background:var(--panel2);color:var(--danger);
    border-color:var(--danger);transform:none}

  /* ---------- buttons ---------- */
  button,.btn{font:400 8px/1.2 var(--pixel);letter-spacing:.02em;text-transform:uppercase;
    padding:9px 10px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line2);border-radius:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    box-shadow:2px 2px 0 #000}
  button:hover,.btn:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
  button:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
  button:disabled{opacity:.45;cursor:default;transform:none}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.primary:hover{background:var(--accent-hi);color:var(--accent-ink);border-color:var(--accent-hi)}
  button.ghost{background:transparent;box-shadow:none}
  button.ghost:hover{background:var(--text);color:var(--bg)}
  button.danger{color:var(--danger)}
  button.danger:hover{background:var(--danger);color:var(--bg);border-color:var(--danger)}
  button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,
  select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .tiny{padding:6px 7px;font-size:7px}

  /* ---------- layout ---------- */
  main{max-width:1160px;margin:0 auto;padding:16px 16px 56px}
  .sysline{display:flex;align-items:center;gap:8px;margin:0 0 12px;
    color:var(--dim);font-size:8px;letter-spacing:.02em;text-transform:uppercase}
  .sysline .prompt{color:var(--accent);animation:blink 1.2s steps(2) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
  .sysline .sysright{margin-left:auto;color:var(--dim);text-align:right}
  .banner{display:none;align-items:center;gap:12px;flex-wrap:wrap;
    margin-bottom:14px;padding:10px 12px;background:var(--panel2);
    border:1px solid var(--line2);color:var(--text);font-size:9px}
  .banner.show{display:flex}
  .tag{background:var(--accent);color:var(--accent-ink);padding:3px 6px;
    font-size:8px;font-weight:400;letter-spacing:.02em}

  .bar-row{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .roots{display:flex;gap:6px;flex-wrap:wrap}
  .root{padding:8px 10px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font:400 7px/1.4 var(--pixel);letter-spacing:.02em;
    text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 #000}
  .root:hover{color:var(--text);border-color:var(--line2);background:var(--panel2)}
  .root.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .browse{flex:1;min-width:220px;display:flex;align-items:stretch;
    background:var(--panel);border:1px solid var(--line);box-shadow:2px 2px 0 #000}
  .browse #upBtn{border:0;border-right:1px solid var(--line);box-shadow:none;
    background:transparent;padding:0 12px;font-size:12px}
  .browse #upBtn:hover{background:var(--panel2);color:var(--accent)}
  .crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;
    overflow-x:auto;white-space:nowrap;padding:0 10px}
  .crumbs::-webkit-scrollbar{height:4px}
  .crumbs::-webkit-scrollbar-thumb{background:var(--line2)}
  .crumbs a{padding:5px 4px;color:var(--muted);font-size:9px}
  .crumbs a:hover{color:var(--accent)}
  .crumbs a.last{color:var(--text)}
  .crumbs .sep{color:var(--dim);padding:0 1px}
  .actions{display:flex;gap:8px;align-items:stretch}

  /* ---------- file list ---------- */
  .panel{position:relative;background:var(--panel);border:1px solid var(--line);
    box-shadow:4px 4px 0 rgba(0,0,0,.55)}
  .panel::before,.panel::after{content:"";position:absolute;width:8px;height:8px;
    pointer-events:none;z-index:2}
  .panel::before{top:-1px;left:-1px;border-top:2px solid var(--accent);
    border-left:2px solid var(--accent)}
  .panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);
    border-right:2px solid var(--accent)}

  .list-head,.row{display:grid;
    grid-template-columns:34px 24px minmax(0,1fr) 86px 196px;
    align-items:center}
  .list-head{padding:9px 0;border-bottom:1px solid var(--line);
    background:var(--panel2);color:var(--dim);font-size:7px;
    letter-spacing:.02em;text-transform:uppercase}
  .list-head span{padding:0 8px}
  .row{border-top:1px solid var(--line);min-height:44px;position:relative}
  .row.dir{cursor:pointer}
  .row:first-child{border-top:0}
  .row:hover{background:var(--panel2)}
  .row:hover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--accent)}
  .cell{padding:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:9px}
  .idx{color:var(--dim);font-size:7px;letter-spacing:.02em}
  .ico{width:18px;height:18px;display:inline-flex;align-items:center;
    justify-content:center;border:1px solid var(--line2);background:var(--bg);
    color:var(--muted);font-size:8px;font-weight:400;line-height:1}
  .row.dir .ico{color:var(--accent);border-color:var(--line2)}
  .row.dir .name a{color:var(--text)}
  .row.dir:hover .name a{color:var(--accent)}
  .name a:hover{color:var(--accent)}
  .size{color:var(--muted);font-size:8px;font-variant-numeric:tabular-nums;
    padding-left:0;padding-right:26px}
  .act{display:flex;gap:4px;justify-content:flex-end;overflow:visible}
  .act .btn, .act button{padding:5px 6px;font-size:7px;box-shadow:1px 1px 0 #000}
  .act .btn:hover{background:var(--text);color:var(--bg)}
  .more-wrap{display:none;position:relative}
  .more-btn{display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:5px 6px;font-size:10px;line-height:1}
  .row-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);
    z-index:40;min-width:170px;padding:6px;background:var(--panel);
    border:1px solid var(--line2);box-shadow:4px 4px 0 rgba(0,0,0,.65);
    flex-direction:column;gap:4px}
  .row-menu.open{display:flex}
  .menu-size{padding:4px 6px 6px;margin-bottom:2px;border-bottom:1px solid var(--line);
    color:var(--dim);font-size:7px;letter-spacing:.02em;text-transform:uppercase}
  .row-menu .btn,.row-menu button{width:100%;justify-content:flex-start;
    text-align:left;padding:7px 8px;font-size:7px}
  .empty{padding:46px 16px;text-align:center;color:var(--dim);font-size:9px;
    letter-spacing:.02em}
  .foot{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--dim);
    font-size:8px;letter-spacing:0;text-transform:none;animation:none;
    transition:none;user-select:text}
  #pathInfo{font-variant-numeric:tabular-nums;text-transform:none;user-select:text}

  /* ---------- overlays ---------- */
  .drop{position:fixed;inset:0;background:rgba(8,8,9,.86);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  .drop.show{display:flex}
  .drop .box{border:2px dashed var(--accent);padding:34px 46px;text-align:center;
    color:var(--accent);background:var(--panel2);font-size:10px;letter-spacing:.02em;
    text-transform:uppercase;box-shadow:6px 6px 0 #000}
  .drop .box small{display:block;margin-top:10px;color:var(--muted);
    letter-spacing:.02em;text-transform:none;font-size:8px}

  #uploads{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));
    display:flex;flex-direction:column;gap:8px;z-index:60}
  .up{background:var(--panel);border:1px solid var(--line2);padding:9px 10px;
    box-shadow:3px 3px 0 #000;font-size:8px}
  .up .top{display:flex;gap:8px;align-items:center}
  .up .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .up .st{color:var(--accent);font-size:7px;letter-spacing:.02em}
  .bar{height:5px;background:var(--bg);border:1px solid var(--line);
    overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);
    transition:width .12s steps(8)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--danger);color:var(--danger);
    padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .15s;
    z-index:80;max-width:90vw;font-size:8px;box-shadow:3px 3px 0 #000}
  .toast.show{opacity:1}

  .confirm{position:fixed;inset:0;z-index:75;display:none;background:rgba(8,8,9,.88);
    align-items:center;justify-content:center;padding:18px}
  .confirm.show{display:flex}
  .cf-panel{width:min(360px,100%);background:var(--panel);border:1px solid var(--line2);
    box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:16px}
  .cf-title{color:var(--accent);font-size:8px;margin-bottom:10px;letter-spacing:.04em}
  .cf-msg{color:var(--text);font-size:9px;line-height:1.7;margin-bottom:14px;
    word-break:break-word}
  .cf-actions{display:flex;gap:8px;justify-content:flex-end}

  /* ---------- editor ---------- */
  .editor{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,8,9,.88);
    padding:18px;align-items:center;justify-content:center}
  .editor.show{display:flex}
  .ed-panel{width:min(1000px,100%);height:min(760px,100%);display:flex;
    flex-direction:column;background:var(--panel);border:1px solid var(--line2);
    box-shadow:6px 6px 0 rgba(0,0,0,.6);position:relative;min-height:0}
  .ed-panel::before{content:"";position:absolute;left:-1px;top:-1px;width:10px;
    height:10px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);
    pointer-events:none}
  .ed-head{display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .ed-path{flex:1;min-width:150px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:8px;color:var(--text);user-select:text}
  .ed-state{font-size:7px;letter-spacing:.02em;color:var(--dim);white-space:nowrap}
  .ed-state.dirty{color:var(--accent)}
  .ed-body{position:relative;flex:1;min-height:0;background:var(--panel);overflow:hidden}
  .ed-hl,.ed-text{position:absolute;inset:0;margin:0;padding:12px 14px;
    border:0;font:12px/1.55 var(--mono);letter-spacing:0;tab-size:2;
    white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}
  .ed-hl{color:var(--text);background:transparent;pointer-events:none;
    overflow:hidden;padding-right:26px}
  .ed-text{background:transparent;color:transparent;
    -webkit-text-fill-color:transparent;caret-color:var(--accent);
    resize:none;outline:none;z-index:2}
  .ed-text::selection{background:rgba(255,140,26,.45)}
  .ed-hl .lnk{color:var(--accent);text-decoration:underline;
    text-underline-offset:2px}
  .editor.plain .ed-hl{display:none}
  .editor.plain .ed-text{color:var(--text);-webkit-text-fill-color:var(--text);
    padding-right:14px}
  .ed-foot{display:flex;align-items:center;gap:10px;padding:8px 10px;
    border-top:1px solid var(--line);color:var(--dim);font-size:7px}
  .ed-foot .sp{flex:1}

  @media(max-width:720px){
    header{gap:10px;padding:10px 12px;flex-wrap:wrap}
    .brand{font-size:10px}
    .meta{margin-left:0;width:100%}
    main{padding:12px 12px 48px}
    .sysline{font-size:7px}
    .sysline .sysright{display:none}
    .list-head,.row{grid-template-columns:34px 20px minmax(0,1fr) 116px}
    .list-head .h-size,.row .size{display:none}
    .row .idx{display:block;padding:8px 2px;text-align:center;
      font-size:8px;color:var(--muted)}
    .desk-act{display:none !important}
    .more-wrap{display:inline-flex}
    .act{gap:12px;padding-right:8px;align-items:center}
    .act .btn, .act button{padding:8px 8px;font-size:8px;min-height:30px}
    .act .more-btn{min-width:40px;padding:8px 8px;font-size:8px}
    .row-menu .btn,.row-menu button{padding:7px 8px;font-size:7px}
    .editor{padding:0}
    .ed-panel{width:100%;height:100%;border:0;box-shadow:none}
    .ed-hl,.ed-text{font-size:11px;padding:10px}
    .ed-hl{padding-right:22px}
    .list-head span{padding:0 6px}
    .cell{padding:8px 6px;font-size:8px}
    .browse{order:3;flex-basis:100%}
    .bar-row{gap:6px}
    .banner .tag{display:none}
  }
</style>
</head>
<body>
<header>
  <a class="brand" id="brandLink" href="/">
    <span>ESP32 MultiTool</span>
  </a>
  <div class="run"><span class="dot" id="dot"></span><span id="modeInfo">offline</span></div>
  <div class="meta">
    <span class="chip" id="freeInfo">-</span>
    <button class="tiny" id="toolBtn" title="Download file_explorer.py for USB access">USB TOOL</button>
    <button class="tiny danger" id="sleepBtn" title="Deep sleep: Wi-Fi turns off, time is kept. Wake with the BOOT button">SLEEP</button>
    <button class="tiny danger" id="resetBtn" title="Reboot the board">RESET</button>
  </div>
</header>

<main>
  <div class="sysline">
    <span class="prompt">&gt;</span><span>FILE_SYSTEM</span>
    <span class="sysright">ESP32 MULTITOOL // LOCAL FS</span>
  </div>

  <div class="banner" id="usbBanner">
    <span class="tag">USB</span>
    <span id="usbText">USB mode: the board application is stopped.</span>
  </div>

  <div class="bar-row">
    <div class="roots" id="roots"></div>
    <div class="browse">
      <button id="upBtn" title="Up">↑</button>
      <div class="crumbs" id="crumbs"></div>
    </div>
    <div class="actions">
      <button id="refreshBtn" title="Refresh" aria-label="Refresh"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" shape-rendering="crispEdges" aria-hidden="true"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M13 1v4h-4"/></svg></button>
      <button id="mkdirBtn">+ DIR</button>
      <button class="primary" id="uploadBtn">UPLOAD</button>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </div>

  <section class="panel">
    <div class="list-head">
      <span>#</span><span></span><span>NAME</span>
      <span class="h-size">SIZE</span><span style="text-align:right">ACTIONS</span>
    </div>
    <div id="rows"></div>
  </section>

  <div class="foot"><span id="pathInfo">/</span></div>
</main>

<div class="drop" id="drop">
  <div class="box">drop files<small>release to upload</small></div>
</div>
<div id="uploads"></div>
<div class="toast" id="toast"></div>

<div class="confirm" id="confirm">
  <div class="cf-panel">
    <div class="cf-title">CONFIRM DELETE</div>
    <div class="cf-msg" id="cfMsg"></div>
    <div class="cf-actions">
      <button class="tiny" id="cfNo">CANCEL</button>
      <button class="tiny danger" id="cfYes">DELETE</button>
    </div>
  </div>
</div>

<div class="editor" id="editor">
  <div class="ed-panel">
    <div class="ed-head">
      <span class="ed-path" id="edPath">/</span>
      <span class="ed-state" id="edState">READY</span>
      <button class="primary tiny" id="edSave">SAVE</button>
      <button class="tiny" id="edClose">CLOSE</button>
    </div>
    <div class="ed-body">
      <pre class="ed-hl" id="edHl" aria-hidden="true"></pre>
      <textarea class="ed-text" id="edText" spellcheck="false"
                autocapitalize="off" autocomplete="off" wrap="soft"></textarea>
    </div>
    <div class="ed-foot">
      <span id="edInfo"></span><span class="sp"></span>
      <span>CTRL+S SAVE &middot; ESC CLOSE</span>
    </div>
  </div>
</div>

<script>
"use strict";
const state = { path: "/", roots: [], info: null, busy: false };
const editor = { path: null, original: "", dirty: false, busy: false,
                 max: 1048576, hlMax: 262144 };
let hlTimer = null;
const $ = (id) => document.getElementById(id);

function join(dir, name) {
  if (!dir || dir === "/") return "/" + name;
  return dir.replace(/\/+$/, "") + "/" + name;
}
function basename(p) {
  if (!p || p === "/") return "/";
  const parts = p.replace(/\/+$/, "").split("/");
  return parts[parts.length - 1] || "/";
}
function dirname(p) {
  if (!p || p === "/") return "/";
  const parts = p.replace(/\/+$/, "").split("/");
  parts.pop();
  return parts.length ? parts.join("/") || "/" : "/";
}
function fmtSize(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function pad2(n) { return n < 10 ? "0" + n : String(n); }
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 4200);
}
function askConfirm(msg) {
  return new Promise((resolve) => {
    const box = $("confirm");
    const yes = $("cfYes");
    const no = $("cfNo");
    $("cfMsg").textContent = msg;
    box.classList.add("show");
    function finish(v) {
      box.classList.remove("show");
      yes.onclick = null;
      no.onclick = null;
      box.onclick = null;
      resolve(v);
    }
    yes.onclick = () => finish(true);
    no.onclick = () => finish(false);
    box.onclick = (ev) => { if (ev.target === box) finish(false); };
  });
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok || !data || data.ok === false) {
    throw new Error((data && data.error) || ("HTTP " + r.status));
  }
  return data;
}

/* ---------- editor ---------- */
function escHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function highlightText(src) {
  if (src.length > editor.hlMax) return escHtml(src) + "\n";
  const re = /(?:https?:\/\/|ftp:\/\/|www\.)[^\s<>"']+/g;
  let out = "", i = 0, m;
  while ((m = re.exec(src))) {
    out += escHtml(src.slice(i, m.index));
    let u = m[0], tail = "";
    const tm = u.match(/[.,;:!?)\]}]+$/);
    if (tm) { tail = tm[0]; u = u.slice(0, -tail.length); }
    out += '<span class="lnk">' + escHtml(u) + "</span>" + escHtml(tail);
    i = m.index + m[0].length;
  }
  return out + escHtml(src.slice(i)) + (src.endsWith("\n") ? "" : "\n");
}
function syncHl() {
  const ta = $("edText"), hl = $("edHl");
  const plain = ta.value.length > editor.hlMax;
  $("editor").classList.toggle("plain", plain);
  if (!plain) hl.innerHTML = highlightText(ta.value);
  hl.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}
function updateEditorState() {
  const dirty = $("edText").value !== editor.original;
  editor.dirty = dirty;
  $("edState").textContent = dirty ? "MODIFIED" : "SAVED";
  $("edState").classList.toggle("dirty", dirty);
}
function onEditorInput() {
  updateEditorState();
  $("editor").classList.toggle("plain",
    $("edText").value.length > editor.hlMax);
  if (hlTimer) clearTimeout(hlTimer);
  hlTimer = setTimeout(syncHl, 120);
}
async function openEditor(entry, full) {
  if (!entry || entry.dir) return;
  if (entry.size > editor.max) {
    toast("File is larger than 1 MB — download only");
    return;
  }
  try {
    const r = await fetch("/api/file?path=" + encodeURIComponent(full));
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try {
        const j = await r.json();
        if (j && j.error) msg = j.error;
      } catch (e) {}
      toast("Cannot open: " + msg);
      return;
    }
    const text = await r.text();
    editor.path = full;
    editor.original = text;
    editor.dirty = false;
    $("edPath").textContent = full;
    $("edPath").title = full;
    $("edText").value = text;
    $("edText").scrollTop = 0;
    $("edText").scrollLeft = 0;
    $("edState").textContent = "SAVED";
    $("edState").classList.remove("dirty");
    const sz = new Blob([text]).size;
    $("edInfo").textContent = fmtSize(sz) +
      (text.length > editor.hlMax ? " · LINKS OFF (>256 KB)" : " · LINK HIGHLIGHT");
    $("editor").classList.add("show");
    syncHl();
    $("edText").focus();
  } catch (e) {
    toast("Cannot open: " + e.message);
  }
}
function closeEditor(force) {
  if (!force) {
    if (editor.busy) return;
    if (editor.dirty && !confirm("Close without saving?")) return;
  }
  $("editor").classList.remove("show");
  editor.path = null;
  editor.original = "";
  editor.dirty = false;
  if (hlTimer) { clearTimeout(hlTimer); hlTimer = null; }
  $("edText").value = "";
  $("edHl").innerHTML = "";
}
async function saveEditor() {
  if (!editor.path || editor.busy) return;
  const text = $("edText").value;
  if (new Blob([text]).size > editor.max) {
    toast("File is larger than 1 MB — cannot save");
    return;
  }
  editor.busy = true;
  $("edSave").disabled = true;
  $("edState").textContent = "SAVING...";
  $("edState").classList.add("dirty");
  try {
    const r = await fetch("/api/save?path=" + encodeURIComponent(editor.path), {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: text
    });
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || !data || data.ok === false) {
      throw new Error((data && data.error) || ("HTTP " + r.status));
    }
    editor.original = text;
    editor.dirty = false;
    $("edState").textContent = "SAVED";
    $("edState").classList.remove("dirty");
    $("edInfo").textContent = fmtSize(new Blob([text]).size) +
      (text.length > editor.hlMax ? " · LINKS OFF (>256 KB)" : " · LINK HIGHLIGHT");
    toast("Saved: " + basename(editor.path));
    await load(state.path);
  } catch (e) {
    $("edState").textContent = "ERROR";
    $("edState").classList.add("dirty");
    toast("Cannot save: " + e.message);
  } finally {
    editor.busy = false;
    $("edSave").disabled = false;
  }
}

function renderRoots() {
  const box = $("roots");
  box.innerHTML = "";
  (state.roots || []).forEach(root => {
    const b = document.createElement("button");
    b.className = "root" + (isUnder(state.path, root.id) ? " active" : "");
    b.textContent = root.label;
    b.onclick = () => load(root.id);
    box.appendChild(b);
  });
}
function isUnder(p, root) {
  if (root === "/") return true;
  return p === root || p.indexOf(root + "/") === 0;
}
function renderCrumbs() {
  const box = $("crumbs");
  box.innerHTML = "";
  const root = (state.roots || []).find(r => isUnder(state.path, r.id) && r.id !== "/") ||
               (state.roots || [])[0] || { id: "/", label: "Internal" };
  const add = (label, path, last) => {
    const a = document.createElement("a");
    a.href = "#";
    a.textContent = label;
    if (last) a.className = "last";
    a.onclick = (e) => { e.preventDefault(); load(path); };
    box.appendChild(a);
  };
  add(root.label, root.id, state.path === root.id || state.path === "/");
  let cur = root.id === "/" ? "" : root.id;
  const rest = state.path.slice(cur.length).split("/").filter(Boolean);
  rest.forEach((part, i) => {
    cur += "/" + part;
    const s = document.createElement("span");
    s.className = "sep";
    s.textContent = "/";
    box.appendChild(s);
    add(part, cur, i === rest.length - 1);
  });
}

function closeRowMenus(except) {
  document.querySelectorAll(".row-menu.open").forEach((m) => {
    if (m !== except) m.classList.remove("open");
  });
}

document.addEventListener("click", (ev) => {
  if (!ev.target.closest(".more-wrap")) closeRowMenus();
});

function renderRows(entries) {
  const body = $("rows");
  body.innerHTML = "";
  $("pathInfo").textContent = state.path;
  if (!entries || !entries.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "// empty";
    body.appendChild(empty);
    return;
  }
  entries.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "row" + (e.dir ? " dir" : "");
    const full = join(state.path, e.name);

    const idx = document.createElement("span");
    idx.className = "cell idx";
    idx.textContent = pad2(i + 1);

    const ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = e.dir ? "D" : "F";

    const nm = document.createElement("div");
    nm.className = "cell name";
    if (e.dir) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = e.name;
      a.onclick = (ev) => { ev.preventDefault(); };
      nm.appendChild(a);
    } else {
      nm.textContent = e.name;
    }

    const size = document.createElement("div");
    size.className = "cell size";
    size.textContent = e.dir ? "—" : fmtSize(e.size);

    const act = document.createElement("div");
    act.className = "cell act";
    if (!e.dir) {
      const ed = document.createElement("button");
      ed.className = "ghost desk-act";
      ed.textContent = "EDIT";
      ed.title = "Edit";
      ed.onclick = () => openEditor(e, full);
      act.appendChild(ed);
      const dl = document.createElement("a");
      dl.className = "btn desk-act";
      dl.href = "/api/download?path=" + encodeURIComponent(full);
      dl.textContent = "DOWNLOAD";
      dl.title = "Download";
      act.appendChild(dl);
    }
    const rn = document.createElement("button");
    rn.className = "ghost desk-act";
    rn.textContent = "RENAME";
    rn.title = "Rename";
    rn.onclick = () => renameEntry(e, full);
    act.appendChild(rn);
    const del = document.createElement("button");
    del.className = "ghost danger";
    del.textContent = "DEL";
    del.title = "Delete";
    del.onclick = () => deleteEntry(e, full);
    act.appendChild(del);

    const moreWrap = document.createElement("div");
    moreWrap.className = "more-wrap";
    const more = document.createElement("button");
    more.className = "more-btn";
    more.type = "button";
    more.textContent = "...";
    more.title = "File actions";
    more.setAttribute("aria-label", "File actions");
    const menu = document.createElement("div");
    menu.className = "row-menu";
    if (!e.dir) {
      const ms = document.createElement("div");
      ms.className = "menu-size";
      ms.textContent = "SIZE " + fmtSize(e.size);
      menu.appendChild(ms);
      const med = document.createElement("button");
      med.className = "ghost";
      med.textContent = "EDIT";
      med.title = "Edit";
      med.onclick = () => openEditor(e, full);
      menu.appendChild(med);
      const mdl = document.createElement("a");
      mdl.className = "btn";
      mdl.href = "/api/download?path=" + encodeURIComponent(full);
      mdl.textContent = "DOWNLOAD";
      mdl.title = "Download";
      menu.appendChild(mdl);
    }
    const mrn = document.createElement("button");
    mrn.className = "ghost";
    mrn.textContent = "RENAME";
    mrn.title = "Rename";
    mrn.onclick = () => renameEntry(e, full);
    menu.appendChild(mrn);
    more.onclick = (ev) => {
      ev.stopPropagation();
      const wasOpen = menu.classList.contains("open");
      closeRowMenus();
      if (!wasOpen) menu.classList.add("open");
    };
    menu.addEventListener("click", (ev) => {
      if (ev.target.closest("button,a")) {
        setTimeout(() => menu.classList.remove("open"), 0);
      }
    });
    moreWrap.appendChild(more);
    moreWrap.appendChild(menu);
    act.appendChild(moreWrap);

    row.appendChild(idx);
    row.appendChild(ico);
    row.appendChild(nm);
    row.appendChild(size);
    row.appendChild(act);
    row.addEventListener("dblclick", (ev) => {
      if (ev.target.closest("button")) return;
      if (e.dir) {
        load(full);
        return;
      }
      if (ev.target.closest("a")) return;
      openEditor(e, full);
    });
    body.appendChild(row);
  });
}

async function loadInfo() {
  try {
    const info = await api("/api/info");
    state.info = info;
    state.roots = info.roots || [{ id: "/", label: "Internal" }];
    $("freeInfo").textContent = "FREE " + fmtSize(info.free);
    $("dot").className = "dot on";
    let m = "";
    if (info.mode === "ap") m = "AP " + (info.ssid || "ESP32-Files") + " · " + (info.ip || "");
    else if (info.mode === "sta") m = "STA " + (info.ssid || "") + " · " + (info.ip || "");
    else if (info.usb) m = "USB · mpremote";
    else m = "offline";
    $("modeInfo").textContent = m;
    $("usbBanner").classList.toggle("show", !!info.usb);
    if (info.usb) {
      $("usbText").textContent =
        "USB mode: access via mpremote. The board application is stopped — press RESET when finished.";
    }
  } catch (e) {
    $("dot").className = "dot";
    $("modeInfo").textContent = "offline";
    toast("No connection to the board: " + e.message);
  }
}

async function load(path) {
  path = path || "/";
  try {
    const data = await api("/api/list?path=" + encodeURIComponent(path));
    state.path = data.path || path;
    renderRoots();
    renderCrumbs();
    renderRows(data.entries);
    if (typeof data.free === "number") {
      $("freeInfo").textContent = "FREE " + fmtSize(data.free);
    }
  } catch (e) {
    toast("Cannot open: " + e.message);
  }
}

async function refresh() {
  await loadInfo();
  await load(state.path);
}

async function mkdir() {
  const name = prompt("New folder name:");
  if (!name) return;
  try {
    await api("/api/mkdir?path=" + encodeURIComponent(join(state.path, name)), { method: "POST" });
    await refresh();
  } catch (e) { toast("Cannot create folder: " + e.message); }
}

async function renameEntry(entry, full) {
  const name = prompt("New name:", entry.name);
  if (!name || name === entry.name) return;
  const to = join(state.path, name);
  try {
    await api("/api/rename?path=" + encodeURIComponent(full) +
              "&to=" + encodeURIComponent(to), { method: "POST" });
    await refresh();
  } catch (e) { toast("Cannot rename: " + e.message); }
}

async function deleteEntry(entry, full) {
  const what = entry.dir ? "folder \"" + entry.name + "\" and all its contents" : "file \"" + entry.name + "\"";
  if (!(await askConfirm("Delete " + what + "?"))) return;
  try {
    await api("/api/delete?path=" + encodeURIComponent(full) +
              (entry.dir ? "&recursive=1" : ""), { method: "POST" });
    await refresh();
  } catch (e) { toast("Cannot delete: " + e.message); }
}

function uploadFiles(files) {
  files = Array.from(files || []);
  if (!files.length) return;
  const dir = state.path;
  let pending = files.length;
  files.forEach(file => {
    const box = document.createElement("div");
    box.className = "up";
    box.innerHTML =
      '<div class="top"><span class="nm"></span><span class="st">0%</span></div>' +
      '<div class="bar"><i></i></div>';
    box.querySelector(".nm").textContent = file.name;
    $("uploads").appendChild(box);
    const bar = box.querySelector("i");
    const st = box.querySelector(".st");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload?path=" + encodeURIComponent(dir) +
             "&name=" + encodeURIComponent(file.name));
    xhr.upload.onprogress = (ev) => {
      if (!ev.lengthComputable) return;
      const p = Math.round(ev.loaded * 100 / ev.total);
      bar.style.width = p + "%";
      st.textContent = p + "%";
    };
    xhr.onload = () => {
      let ok = false, msg = "";
      try {
        const r = JSON.parse(xhr.responseText || "{}");
        ok = xhr.status === 200 && r.ok !== false;
        msg = r.error || "";
      } catch (e) { msg = "HTTP " + xhr.status; }
      if (ok) {
        bar.style.width = "100%";
        st.textContent = "DONE";
        setTimeout(() => box.remove(), 1500);
      } else {
        st.textContent = "ERROR";
        st.style.color = "var(--danger)";
        toast(file.name + ": " + (msg || "upload error"));
        setTimeout(() => box.remove(), 5000);
      }
      if (--pending === 0) refresh();
    };
    xhr.onerror = () => {
      st.textContent = "ERROR";
      toast(file.name + ": network unavailable");
      if (--pending === 0) refresh();
    };
    xhr.send(file);
  });
}

function initDrop() {
  const drop = $("drop");
  let depth = 0;
  window.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer || Array.from(e.dataTransfer.types).indexOf("Files") < 0) return;
    depth++; drop.classList.add("show");
  });
  window.addEventListener("dragover", (e) => { e.preventDefault(); });
  window.addEventListener("dragleave", () => {
    depth = Math.max(0, depth - 1);
    if (!depth) drop.classList.remove("show");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    depth = 0;
    drop.classList.remove("show");
    if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
  });
}

async function downloadUsbTool() {
  const b = $("toolBtn");
  if (b.disabled) return;
  // Open the instructions immediately while the browser treats this as a user action.
  const help = window.open("/usb", "_blank");
  if (help) {
    try { help.opener = null; } catch (e) {}
  }
  const old = b.textContent;
  b.disabled = true;
  b.textContent = "...";
  try {
    const r = await fetch("/api/usb-tool", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    let saved = false;
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: "file_explorer.py",
          types: [{ description: "Python script",
                    accept: { "text/x-python": [".py"] } }]
        });
        const w = await h.createWritable();
        await w.write(blob);
        await w.close();
        toast("Saved: " + h.name);
        saved = true;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        // no file picker access — use the normal download
      }
    }
    if (!saved) {
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = "file_explorer.py";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast("Script downloaded to the Downloads folder");
    }
  } catch (e) {
    toast("Cannot download script: " + (e.message || e));
  } finally {
    b.disabled = false;
    b.textContent = old;
  }
}

function init() {
  $("upBtn").onclick = () => load(dirname(state.path));
  $("refreshBtn").onclick = refresh;
  $("mkdirBtn").onclick = mkdir;
  $("uploadBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => { uploadFiles(e.target.files); e.target.value = ""; };
  $("toolBtn").onclick = downloadUsbTool;
  $("sleepBtn").onclick = async () => {
    if (!confirm("Put the board into deep sleep?\nWi-Fi will turn off, time will be kept.\nPress BOOT to wake.")) return;
    const b = $("sleepBtn");
    b.disabled = true;
    b.textContent = ":";
    try { await api("/api/sleep", { method: "POST" }); } catch (e) {}
    toast("Board is asleep. Press BOOT to wake.");
    setTimeout(() => { b.disabled = false; b.textContent = "SLEEP"; }, 15000);
  };
  $("resetBtn").onclick = async () => {
    if (!confirm("Reboot the board? The connection will be interrupted.")) return;
    const b = $("resetBtn");
    b.disabled = true;
    b.textContent = "…";
    try { await api("/api/reset", { method: "POST" }); } catch (e) {}
    toast("Board is rebooting…");
    setTimeout(() => { b.disabled = false; b.textContent = "RESET"; }, 7000);
  };
  $("edSave").onclick = saveEditor;
  $("edClose").onclick = () => closeEditor();
  $("edText").addEventListener("input", onEditorInput);
  $("edText").addEventListener("scroll", () => {
    $("edHl").scrollTop = $("edText").scrollTop;
    $("edHl").scrollLeft = $("edText").scrollLeft;
  });
  document.addEventListener("keydown", (e) => {
    if (!$("editor").classList.contains("show")) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault();
      saveEditor();
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeEditor();
    }
  });
  initDrop();
  refresh();
}
init();
</script>
</body>
</html>
