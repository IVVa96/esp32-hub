  :root{
    --bg:#000000; --panel:#0a0a0b; --panel2:#121214; --panel3:#1a1a1d;
    --line:#3d3d42; --line2:#5a5a62;
    --text:#f1f0f0; --muted:#bcbbbb; --dim:#8e8b8b;
    --accent:#ff8c1a; --accent-ink:#000000; --accent-hi:#ffb45e;
    --danger:#ff5c5c; --ok:#7dff9a;
    --pixel:"Press Start 2P",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#000;color:var(--text);
    font:10px/1.85 var(--pixel);-webkit-font-smoothing:none;
    text-rendering:geometricPrecision;letter-spacing:0}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:rgba(0,0,0,.94);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;color:var(--accent);
    font-size:11px;white-space:nowrap}
  .brand:hover{color:var(--accent-hi)}
  .run{display:flex;align-items:center;gap:7px;color:var(--muted);
    font-size:8px;white-space:nowrap}
  .dot{width:7px;height:7px;background:var(--dim);display:inline-block;
    box-shadow:0 0 0 1px #000}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .meta{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tiny{border:1px solid var(--line2);padding:6px 8px 5px;font-size:7px;
    background:var(--panel2);color:var(--muted);box-shadow:none}
  .tiny:hover{background:var(--panel2);color:var(--accent);border-color:var(--accent)}
  .tiny.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
  .tiny.danger{color:var(--danger);border-color:var(--danger)}
  main{max-width:1060px;margin:0 auto;padding:16px 14px 40px}
  .sysline{display:flex;align-items:center;gap:8px;color:var(--dim);
    font-size:8px;margin:2px 0 14px}
  .sysline .prompt{color:var(--accent)}
  .sysright{margin-left:auto;color:var(--line2)}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border:1px solid var(--line);background:var(--panel);padding:10px;margin-bottom:14px}
  .bar label{font-size:7px;color:var(--dim)}
  .bar select{max-width:190px}
  select,input{font:inherit;font-size:8px;color:var(--text);background:#000;
    border:1px solid var(--line2);padding:6px 6px 5px;border-radius:0;
    -webkit-appearance:none;appearance:none;min-width:0}
  select:focus,input:focus{outline:0;border-color:var(--accent)}
  .btn{border:1px solid var(--line2);padding:7px 9px 6px;font-size:7px;
    background:var(--panel2);color:var(--muted)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.primary{border-color:var(--accent);color:var(--accent)}
  .dirty{margin-left:auto;font-size:7px;color:var(--dim)}
  .dirty.on{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
  .pin{border:1px solid var(--line);background:var(--panel2);padding:10px;
    box-shadow:inset 0 0 0 1px #000}
  .pin.active{border-color:var(--accent)}
  .pin.pair{border-color:var(--line);background:var(--panel);opacity:.75}
  .pin-h{display:flex;align-items:center;gap:6px;font-size:8px;color:var(--muted)}
  .pin.active .pin-h .gpio{color:var(--accent)}
  .pin-h .tag{font-size:6px;color:var(--dim);border:1px solid var(--line2);
    padding:2px 4px 1px}
  .pin-h .state{margin-left:auto;font-size:6px;color:var(--dim)}
  .row{display:flex;align-items:center;gap:8px;margin-top:7px}
  .row label{font-size:6px;color:var(--dim);width:34px;flex:0 0 auto}
  .row select,.row input{flex:1 1 auto;width:100%}
  .row[hidden]{display:none}
  .note{font-size:6px;color:var(--dim);margin-top:8px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
    border:1px solid var(--accent);background:#000;color:var(--accent);
    padding:10px 14px 9px;font-size:8px;max-width:calc(100% - 32px);
    box-shadow:0 0 18px rgba(255,140,26,.25)}
  .toast[hidden]{display:none}
  .toast.err{border-color:var(--danger);color:var(--danger)}
  @media (max-width:720px){
    header{gap:10px;padding:10px 12px;flex-wrap:wrap}
    .meta{width:100%}
    .sysright{display:none}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span>ESP32 MultiTool</span></a>
  <div class="run"><span class="dot" id="dot"></span><span id="modeInfo">offline</span></div>
  <div class="meta">
    <button class="tiny" id="usbBtn">USB</button>
    <button class="tiny" id="bleBtn">BLE</button>
    <button class="tiny" onclick="location.href='/logout'">LOGOUT</button>
  </div>
</header>

<main>
  <div class="sysline">
    <span class="prompt">&gt;</span><span>MIDI PATCH</span>
    <span class="sysright">MIDI // WEB</span>
  </div>

  <section class="bar">
    <label>PRESET</label>
    <select id="preset"></select>
    <button class="btn" id="loadBtn">LOAD</button>
    <button class="btn" id="saveBtn">SAVE</button>
    <button class="btn" id="saveAsBtn">SAVE AS</button>
    <button class="btn" id="renameBtn">RENAME</button>
    <button class="btn danger" id="deleteBtn">DELETE</button>
    <span class="dirty" id="dirty">CLEAN</span>
  </section>

  <section class="grid" id="grid"></section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
var S = null;
var TYPES = ["\u2014", "Btn/Sw", "Virt_sw", "Pot", "Encoder"];

function $(id) { return document.getElementById(id); }

function toast(msg, isErr) {
  var t = $("toast");
  t.textContent = msg;
  t.className = isErr ? "toast err" : "toast";
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.hidden = true; }, 2600);
}

function api(q, method) {
  return fetch("/api/midi?" + q, { method: method || "GET", cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { toast(d.error || "request failed", true); return null; }
      apply(d);
      return d;
    })
    .catch(function () { toast("connection lost", true); return null; });
}

function post(q) { return api(q, "POST"); }

function apply(d) {
  S = d;
  $("dot").className = "dot on";
  $("modeInfo").textContent = d.mode === "ble" ? "BLE MIDI" : "USB MIDI";
  $("usbBtn").className = d.mode === "ble" ? "tiny" : "tiny on";
  $("bleBtn").className = d.mode === "ble" ? "tiny on" : "tiny";
  var pr = $("preset");
  var want = d.preset;
  pr.innerHTML = "";
  for (var i = 0; i < d.presets.length; i++) {
    var o = document.createElement("option");
    o.value = d.presets[i];
    o.textContent = d.presets[i].toUpperCase();
    pr.appendChild(o);
  }
  pr.value = want;
  $("dirty").textContent = d.dirty ? "UNSAVED *" : "CLEAN";
  $("dirty").className = d.dirty ? "dirty on" : "dirty";
  drawPins(d);
}

function freePairList(pin, curPair) {
  var out = [];
  var seen = {};
  if (curPair !== null && curPair !== undefined) {
    out.push(String(curPair));
    seen[curPair] = 1;
  }
  for (var i = 0; i < S.pins.length; i++) {
    var p = S.pins[i];
    if (p.pin === pin || seen[p.pin]) continue;
    if (p.type === "\u2014") out.push(String(p.pin));
  }
  return out;
}

function drawPins(d) {
  var g = $("grid");
  g.innerHTML = "";
  for (var i = 0; i < d.pins.length; i++) {
    var p = d.pins[i];
    var el = document.createElement("div");
    var isPair = p.type === "encB";
    el.className = "pin" + (isPair ? " pair" : (p.type === "\u2014" ? "" : " active"));
    el.setAttribute("data-pin", p.pin);

    var h = '<div class="pin-h"><span class="gpio">GPIO ' + p.pin + "</span>";
    if (p.adc) h += '<span class="tag">ADC</span>';
    if (isPair) h += '<span class="tag">PAIR</span>';
    h += '<span class="state">' + (p.type === "\u2014" ? "OFF" : p.type.toUpperCase()) + "</span></div>";
    el.innerHTML = h;

    if (isPair) {
      var n = document.createElement("div");
      n.className = "note";
      n.textContent = "ENCODER PARTNER OF GPIO " + p.pair;
      el.appendChild(n);
      g.appendChild(el);
      continue;
    }

    el.appendChild(row("TYPE", select("type", TYPES, p.type)));
    el.appendChild(row("CC", input("cc", p.cc, 0, 127)));
    var chs = [];
    for (var c = 1; c <= 16; c++) chs.push(String(c));
    el.appendChild(row("CH", select("ch", chs, String(p.ch))));

    var pairRow = row("PAIR", select("pair", freePairList(p.pin, p.pair),
                                     p.pair === null ? "" : String(p.pair)));
    pairRow.className = "row";
    if (p.type !== "Encoder") pairRow.hidden = true;
    el.appendChild(pairRow);

    if (p.type === "Pot" && !p.adc) {
      var w = document.createElement("div");
      w.className = "note";
      w.textContent = "NOT AN ADC PIN";
      el.appendChild(w);
    }
    g.appendChild(el);
  }
}

function row(label, ctl) {
  var r = document.createElement("div");
  r.className = "row";
  var l = document.createElement("label");
  l.textContent = label;
  r.appendChild(l);
  r.appendChild(ctl);
  return r;
}

function select(k, values, cur) {
  var s = document.createElement("select");
  s.setAttribute("data-k", k);
  for (var i = 0; i < values.length; i++) {
    var o = document.createElement("option");
    o.value = values[i];
    o.textContent = String(values[i]).toUpperCase();
    s.appendChild(o);
  }
  s.value = cur;
  return s;
}

function input(k, val, min, max) {
  var el = document.createElement("input");
  el.type = "number";
  el.min = min;
  el.max = max;
  el.value = val;
  el.setAttribute("data-k", k);
  return el;
}

function readCard(card) {
  var pin = card.getAttribute("data-pin");
  var type = null, cc = null, ch = null, pair = "";
  var els = card.querySelectorAll("[data-k]");
  for (var i = 0; i < els.length; i++) {
    var k = els[i].getAttribute("data-k");
    var v = els[i].value;
    if (k === "type") type = v;
    else if (k === "cc") cc = v;
    else if (k === "ch") ch = v;
    else if (k === "pair") pair = v;
  }
  return { pin: pin, type: type, cc: cc, ch: ch, pair: pair };
}

function sendPin(card) {
  var v = readCard(card);
  if (v.type === null) return;
  var q = "action=setpin&pin=" + v.pin +
          "&type=" + encodeURIComponent(v.type) +
          "&cc=" + encodeURIComponent(v.cc) +
          "&ch=" + encodeURIComponent(v.ch) +
          "&pair=" + encodeURIComponent(v.pair || "");
  post(q);
}

$("grid").addEventListener("change", function (e) {
  var card = e.target.closest ? e.target.closest(".pin") : null;
  if (!card) return;
  sendPin(card);
});

$("loadBtn").onclick = function () {
  var n = $("preset").value;
  if (!n) return;
  post("action=load&name=" + encodeURIComponent(n));
};

$("saveBtn").onclick = function () {
  if (!S) return;
  post("action=save&name=" + encodeURIComponent(S.preset) +
       "&overwrite=1");
};

$("saveAsBtn").onclick = function () {
  var n = prompt("Preset name", S ? S.preset : "preset");
  if (!n) return;
  post("action=save&name=" + encodeURIComponent(n) +
       "&overwrite=" + (confirm("Overwrite if exists?") ? "1" : "0"));
};

$("renameBtn").onclick = function () {
  if (!S || S.preset === "default") { toast("default cannot be renamed", true); return; }
  var n = prompt("New name", S.preset);
  if (!n) return;
  post("action=rename&old=" + encodeURIComponent(S.preset) +
       "&new=" + encodeURIComponent(n));
};

$("deleteBtn").onclick = function () {
  if (!S || S.preset === "default") { toast("default cannot be deleted", true); return; }
  if (!confirm("Delete preset " + S.preset + "?")) return;
  post("action=delete&name=" + encodeURIComponent(S.preset));
};

$("usbBtn").onclick = function () { post("action=mode&mode=wire"); };
$("bleBtn").onclick = function () { post("action=mode&mode=ble"); };

api("action=state");
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) api("action=state");
});
</script>
</body>
</html>
