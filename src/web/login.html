<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 MultiTool — Login</title>
<style>
  :root{
    --bg:#000;--panel:#0b0b0b;--panel2:#111;--line:#2a2a2a;
    --line2:#3a3a3a;--text:#f4f1ea;--muted:#a7a29a;--dim:#77736c;
    --accent:#ff8c1a;--danger:#ff4d3d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Courier New",monospace;font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:18px;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  }
  .box{
    width:min(360px,100%);background:var(--panel);border:1px solid var(--accent);
    box-shadow:0 0 0 1px #000,0 0 28px rgba(255,140,26,.16);
    padding:22px 20px 20px;position:relative;
  }
  .box::before,.box::after{
    content:"";position:absolute;width:10px;height:10px;border:2px solid var(--accent);
  }
  .box::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
  .box::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
  .lock{font-size:26px;line-height:1;color:var(--accent);margin-bottom:14px}
  h1{margin:0 0 20px;font-size:13px;letter-spacing:1px;color:var(--text)}
  label{display:block;color:var(--muted);font-size:9px;letter-spacing:1px;margin-bottom:7px}
  input{
    width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line2);
    color:var(--text);font:inherit;font-size:13px;outline:none;letter-spacing:2px;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 1px #000}
  button{
    width:100%;margin-top:12px;padding:11px 12px;background:var(--accent);
    color:#000;border:1px solid var(--accent);font:inherit;font-size:11px;
    letter-spacing:1px;cursor:pointer;
  }
  button:hover{filter:brightness(1.08)}
  .err{
    display:none;margin-top:14px;padding:8px 10px;border:1px solid var(--danger);
    color:var(--danger);font-size:9px;line-height:1.5;
  }
  .err.on{display:block}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <div class="lock">[#]</div>
  <h1>ESP32 MULTITOOL</h1>
  <label for="password">PASSWORD</label>
  <input id="password" name="password" type="password" required
         autofocus autocomplete="current-password" spellcheck="false">
  <button type="submit">ENTER</button>
  <div class="err" id="err">WRONG PASSWORD</div>
</form>
<script>
  if (location.search.indexOf("e=1") >= 0) {
    document.getElementById("err").className = "err on";
    document.getElementById("password").select();
  }
</script>
</body>
</html>
